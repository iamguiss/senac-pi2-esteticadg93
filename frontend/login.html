<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Estética DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

    <!-- Header -->
    <header id="dg93-navbar" class="navbar"></header>

    <main class="container" style="max-width: 420px; padding: var(--space-8) var(--space-5) var(--space-9);">
        <h1 style="font-size: var(--fs-h2);">Entrar na sua conta</h1>
        <p style="margin-top: var(--space-2);">Acesse para acompanhar seus agendamentos.</p>

        <form id="form-login" class="stack" style="margin-top: var(--space-6);" novalidate>
            <div class="field" id="campo-email">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="input" placeholder="seuemail@exemplo.com" required>
                <span class="field-error">Informe um e-mail válido.</span>
            </div>

            <div class="field" id="campo-senha">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="input" placeholder="••••••••" required minlength="6">
                <span class="field-error">A senha deve ter pelo menos 6 caracteres.</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-login">
                <span id="btn-login-label">Entrar</span>
            </button>

            <p class="text-center" style="font-size: var(--fs-caption);">
                Não tem uma conta? <a href="cadastro.html"
                    style="color: var(--dg-red); font-weight:600;">Cadastre-se</a>
            </p>
        </form>
    </main>

    <!-- Footer -->
    <footer id="dg93-footer" class="site-footer"></footer>

    <script src="assets/js/data/mock-data.js"></script>
    <script src="assets/js/data/store.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/toast.js"></script>
    <script src="assets/js/components/navbar.js"></script>
    <script src="assets/js/components/footer.js"></script>
    <script>
        DG93Navbar.render('');
        DG93Footer.render();

        const form = document.getElementById('form-login');
        const campoEmail = document.getElementById('campo-email');
        const campoSenha = document.getElementById('campo-senha');
        const btn = document.getElementById('btn-login');
        const btnLabel = document.getElementById('btn-login-label');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            const emailValido = /\S+@\S+\.\S+/.test(email);
            campoEmail.classList.toggle('has-error', !emailValido);

            const senhaValida = senha.length >= 6;
            campoSenha.classList.toggle('has-error', !senhaValida);

            if (!emailValido || !senhaValida) return;

            btn.disabled = true;
            btnLabel.innerHTML = '<span class="spinner"></span> Entrando...';

            setTimeout(() => {
                const usuario = DG93Auth.login(email);
                btn.disabled = false;
                btnLabel.textContent = 'Entrar';

                if (!usuario) {
                    DG93Toast.show('E-mail não encontrado na base de demonstração.', 'error');
                    return;
                }
                DG93Toast.show(`Bem-vindo(a), ${usuario.nome.split(' ')[0]}!`, 'success');
                setTimeout(() => {
                    window.location.href = usuario.perfil === 'admin' ? 'admin/dashboard.html' : 'cliente/dashboard.html';
                }, 500);
            }, 600);
        });
    </script>
</body>

</html>
