<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços e valores — Estética DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>


    <!-- Header -->
    <header id="dg93-navbar" class="navbar"></header>
    <main>
        <section style="background: var(--dg-black); color: var(--dg-white); padding: var(--space-7) 0;">
            <div class="container">
                <h1 style="color:#fff; font-size: var(--fs-h2);">Serviços e valores</h1>
                <p style="color: var(--dg-metal); margin-top: var(--space-2);">Preços fixos e transparentes. Escolha um
                    serviço para iniciar o agendamento.</p>
            </div>
        </section>

        <section class="container" style="padding: var(--space-6) var(--space-5) var(--space-8);">
            <div class="row-between" style="margin-bottom: var(--space-5);">
                <div class="field" style="margin:0; min-width:220px;">
                    <label for="filtro-categoria">Filtrar por categoria</label>
                    <select id="filtro-categoria" class="select">
                        <option value="">Todas as categorias</option>
                    </select>
                </div>
            </div>

            <div class="grid-services" id="dg93-lista-servicos">
                <!-- injetado via JS -->
            </div>

            <div class="empty-state" id="dg93-servicos-vazio" hidden>
                <h3>Nenhum serviço encontrado</h3>
                <p>Tente selecionar outra categoria.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->

    <footer id="dg93-footer" class="site-footer"></footer>

    <script src="assets/js/data/mock-data.js"></script>
    <script src="assets/js/data/store.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components/toast.js"></script>
    <script src="assets/js/components/navbar.js"></script>
    <script src="assets/js/components/footer.js"></script>
    <script>
        DG93Navbar.render('servicos');
        DG93Footer.render();

        const todosServicos = DG93Store.getServicos({ somenteAtivos: true });
        const categorias = [...new Set(todosServicos.map(s => s.categoria))];
        const selectCategoria = document.getElementById('filtro-categoria');
        categorias.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.textContent = c;
            selectCategoria.appendChild(opt);
        });

        function renderServicos(categoria) {
            const lista = categoria ? todosServicos.filter(s => s.categoria === categoria) : todosServicos;
            const container = document.getElementById('dg93-lista-servicos');
            const vazio = document.getElementById('dg93-servicos-vazio');

            vazio.hidden = lista.length > 0;
            container.innerHTML = lista.map(s => `
      <article class="service-card">
        <div class="service-card__media">Foto do serviço</div>
        <div class="service-card__body">
          <span class="service-card__category">${s.categoria}</span>
          <h3>${s.nome_servico}</h3>
          <p>${s.descricao}</p>
          <div class="service-card__price">${DG93Utils.formatCurrency(s.preco)}</div>
        </div>
        <div class="service-card__footer">
          <a href="cadastro.html" class="btn btn-dark btn-block">Agendar este serviço</a>
        </div>
      </article>
    `).join('');
        }

        selectCategoria.addEventListener('change', (e) => renderServicos(e.target.value));
        renderServicos('');
    </script>

</body>

</html>
