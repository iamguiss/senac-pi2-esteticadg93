<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do agendamento — Área do cliente | DG93</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

  <!-- Área do cliente -->
  <div class="app-shell">
    <aside id="dg93-sidebar" class="app-sidebar"></aside>

    <div class="app-main">
      <header id="dg93-topbar" class="app-topbar"></header>

      <main class="app-content" style="max-width: 640px;">
        <a href="agendamentos.html"
          style="font-size: var(--fs-caption); font-weight:600; color:var(--text-secondary);">‹ Voltar para meus
          agendamentos</a>

        <div id="conteudo" style="margin-top: var(--space-4);"></div>
        <div class="empty-state" id="nao-encontrado" hidden>
          <h3>Agendamento não encontrado</h3>
          <p>Ele pode ter sido removido dos dados de demonstração.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: cancelar -->
  <div class="modal-overlay" id="modal-cancelar">
    <div class="modal">
      <div class="modal__head">
        <h3>Cancelar agendamento</h3>
        <button class="modal__close" data-modal-close aria-label="Fechar">×</button>
      </div>
      <p>Tem certeza que deseja cancelar este agendamento? Essa ação não pode ser desfeita.</p>
      <div class="modal__actions">
        <button class="btn btn-ghost" data-modal-close>Voltar</button>
        <button class="btn btn-danger" id="confirmar-cancelamento">Sim, cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal: reagendamento -->
  <div class="modal-overlay" id="modal-reagendar">
    <div class="modal">
      <div class="modal__head">
        <h3>Solicitar reagendamento</h3>
        <button class="modal__close" data-modal-close aria-label="Fechar">×</button>
      </div>
      <form id="form-reagendar">
        <div class="field">
          <label for="reagenda-data">Nova data desejada</label>
          <input type="date" id="reagenda-data" class="input" required>
        </div>
        <div class="field">
          <label for="reagenda-hora">Novo horário desejado</label>
          <select id="reagenda-hora" class="select" required>
            <option value="">Selecione</option>
            <option>08:00</option>
            <option>08:30</option>
            <option>09:00</option>
            <option>09:30</option>
            <option>10:00</option>
            <option>10:30</option>
            <option>11:00</option>
            <option>11:30</option>
            <option>12:00</option>
            <option>12:30</option>
            <option>13:00</option>
            <option>13:30</option>
            <option>14:00</option>
            <option>14:30</option>
            <option>15:00</option>
            <option>15:30</option>
            <option>16:00</option>
            <option>16:30</option>
            <option>17:00</option>
            <option>17:30</option>
            <option>18:00</option>
            <option>18:30</option>
            <option>19:00</option>
            <option>19:30</option>
            <option>20:00</option>
            <option>20:30</option>
            <option>21:00</option>
            <option>21:30</option>
            <option>22:00</option>
          </select>
        </div>
        <div class="field">
          <label for="reagenda-motivo">Motivo (opcional)</label>
          <textarea id="reagenda-motivo" class="input" rows="3"
            placeholder="Explique o motivo do reagendamento"></textarea>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-ghost" data-modal-close>Cancelar</button>
          <button type="submit" class="btn btn-primary">Enviar solicitação</button>
        </div>
      </form>
    </div>
  </div>


  <script src="../assets/js/data/mock-data.js"></script>
  <script src="../assets/js/data/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/components/modal.js"></script>
  <script src="../assets/js/components/sidebar.js"></script>
  <script>
    const usuario = DG93Sidebar.render({ perfil: 'cliente', active: 'agendamentos' });

    if (usuario) {
      const id = DG93Utils.qs('id');
      const agendamento = id ? DG93Store.getAgendamento(id) : null;

      if (!agendamento || agendamento.id_user !== usuario.id_user) {
        document.getElementById('nao-encontrado').hidden = false;
      } else {
        renderConteudo(agendamento);
      }

      function renderConteudo(a) {
        const servico = DG93Store.getServico(a.id_service);
        const podeCancelar = ['AGUARDANDO_CONFIRMACAO', 'APROVADO'].includes(a.status);
        const podeReagendar = ['AGUARDANDO_CONFIRMACAO', 'APROVADO'].includes(a.status);

        document.getElementById('conteudo').innerHTML = `
        <div class="row-between" style="margin: var(--space-4) 0;">
          <h2>${servico.nome_servico}</h2>
          ${DG93Utils.statusBadgeHtml(a.status)}
        </div>

        <div class="card stack">
          <div class="row-between"><span class="text-muted">Valor</span><strong>${DG93Utils.formatCurrency(servico.preco)}</strong></div>
          <div class="row-between"><span class="text-muted">Data</span><strong>${DG93Utils.formatDateLong(a.data)}</strong></div>
          <div class="row-between"><span class="text-muted">Horário</span><strong>${a.hora}</strong></div>
          <div class="row-between"><span class="text-muted">Local</span><strong>${DG93Utils.escapeHtml(a.local)}</strong></div>
          <div class="row-between"><span class="text-muted">Categoria</span><strong>${servico.categoria}</strong></div>
        </div>

        ${a.reagendamento_solicitado ? `
          <div class="alert alert--info" style="margin-top: var(--space-4);">
            Reagendamento solicitado para <strong>${DG93Utils.formatDate(a.reagendamento_solicitado.data)} às ${a.reagendamento_solicitado.hora}</strong>. Aguardando análise da equipe DG93.
          </div>` : ''}

        ${a.status === 'NEGADO' ? `<div class="alert alert--error" style="margin-top: var(--space-4);">Este agendamento foi negado pela equipe DG93. Entre em contato para mais informações.</div>` : ''}
        ${a.status === 'CANCELADO' ? `<div class="alert alert--warning" style="margin-top: var(--space-4);">Este agendamento foi cancelado.</div>` : ''}

        <div class="row-between" style="margin-top: var(--space-6);">
          ${podeReagendar ? `<button class="btn btn-outline" id="btn-reagendar">Solicitar reagendamento</button>` : '<span></span>'}
          ${podeCancelar ? `<button class="btn btn-danger" id="btn-cancelar">Cancelar agendamento</button>` : ''}
        </div>
      `;

        if (podeCancelar) {
          document.getElementById('btn-cancelar').addEventListener('click', () => DG93Modal.open('modal-cancelar'));
        }
        if (podeReagendar) {
          document.getElementById('btn-reagendar').addEventListener('click', () => DG93Modal.open('modal-reagendar'));
        }
      }

      document.getElementById('confirmar-cancelamento').addEventListener('click', () => {
        DG93Store.atualizarStatusAgendamento(agendamento.id_agendamento, 'CANCELADO');
        DG93Modal.close('modal-cancelar');
        DG93Toast.show('Agendamento cancelado.', 'success');
        setTimeout(() => location.reload(), 500);
      });

      document.getElementById('form-reagendar').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = document.getElementById('reagenda-data').value;
        const hora = document.getElementById('reagenda-hora').value;
        if (!data || !hora) return;
        DG93Store.solicitarReagendamento(agendamento.id_agendamento, {
          data, hora, motivo: document.getElementById('reagenda-motivo').value.trim()
        });
        DG93Modal.close('modal-reagendar');
        DG93Toast.show('Solicitação de reagendamento enviada.', 'success');
        setTimeout(() => location.reload(), 500);
      });
    }
  </script>
</body>

</html>
