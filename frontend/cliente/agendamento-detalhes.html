<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do agendamento — Área do cliente | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <!-- Área do cliente -->
    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>
      
        <div class="app-main">
          <header id="dg93-topbar" class="app-topbar"></header>
      
          <main class="app-content" style="max-width: 640px;">
            <a href="agendamentos.html" style="font-size: var(--fs-caption); font-weight:600; color:var(--text-secondary);">‹ Voltar para meus agendamentos</a>
      
            <div id="conteudo" style="margin-top: var(--space-4);"></div>
            <div class="empty-state" id="nao-encontrado" hidden>
              <h3>Agendamento não encontrado</h3>
              <p>Ele pode ter sido removido dos dados de demonstração.</p>
            </div>
          </main>
        </div>
      </div>

    <!-- Modal: cancelar -->
    <div class="modal-overlay" id="modal-cancelar">
        <div class="modal">
          <div class="modal__head">
            <h3>Cancelar agendamento</h3>
            <button class="modal__close" data-modal-close aria-label="Fechar">×</button>
          </div>
          <p>Tem certeza que deseja cancelar este agendamento? Essa ação não pode ser desfeita.</p>
          <div class="modal__actions">
            <button class="btn btn-ghost" data-modal-close>Voltar</button>
            <button class="btn btn-danger" id="confirmar-cancelamento">Sim, cancelar</button>
          </div>
        </div>
      </div>

    <!-- Modal: reagendamento -->
    <div class="modal-overlay" id="modal-reagendar">
        <div class="modal">
          <div class="modal__head">
            <h3>Solicitar reagendamento</h3>
            <button class="modal__close" data-modal-close aria-label="Fechar">×</button>
          </div>
          <form id="form-reagendar">
            <div class="field">
              <label for="reagenda-data">Nova data desejada</label>
              <input type="date" id="reagenda-data" class="input" required>
            </div>
            <div class="field">
              <label for="reagenda-hora">Novo horário desejado</label>
              <select id="reagenda-hora" class="select" required>
                <option value="">Selecione</option>
                <option>08:00</option><option>09:00</option><option>10:30</option>
                <option>13:00</option><option>14:00</option><option>15:30</option>
              </select>
            </div>
            <div class="field">
              <label for="reagenda-motivo">Motivo (opcional)</label>
              <textarea id="reagenda-motivo" class="input" rows="3" placeholder="Explique o motivo do reagendamento"></textarea>
            </div>
            <div class="modal__actions">
              <button type="button" class="btn btn-ghost" data-modal-close>Cancelar</button>
              <button type="submit" class="btn btn-primary">Enviar solicitação</button>
            </div>
          </form>
        </div>
      </div>

</body>

</html>
