<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil — Área do cliente | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <!-- Área do cliente -->
    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>

        <div class="app-main">
            <header id="dg93-topbar" class="app-topbar"></header>

            <main class="app-content" style="max-width: 560px;">
                <h2>Meu perfil</h2>
                <p style="margin-top: var(--space-2); margin-bottom: var(--space-6);">Seus dados cadastrais na Estética
                    DG93.</p>

                <form id="form-perfil" class="card stack" novalidate>
                    <div class="field" id="campo-nome">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" class="input" required>
                        <span class="field-error">Informe seu nome completo.</span>
                    </div>
                    <div class="field" id="campo-email">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" class="input" required>
                        <span class="field-error">Informe um e-mail válido.</span>
                    </div>
                    <div class="field">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" class="input" disabled>
                        <span class="field-hint">O CPF não pode ser alterado.</span>
                    </div>
                    <div class="field">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" class="select">
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Prefiro não informar">Prefiro não informar</option>
                        </select>
                    </div>
                    <div class="row-between">
                        <span class="text-muted" style="font-size: var(--fs-caption);">Perfil: <strong
                                id="tipo-perfil"></strong></span>
                        <button type="submit" class="btn btn-primary" id="btn-salvar">
                            <span id="btn-salvar-label">Salvar alterações</span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

</body>

</html>
