<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Área do cliente | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <!-- Área do cliente -->
    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>
      
        <div class="app-main">
          <header id="dg93-topbar" class="app-topbar"></header>
      
          <main class="app-content" id="conteudo" hidden>
            <div class="row-between" style="margin-bottom: var(--space-6);">
              <div>
                <h2 id="saudacao"></h2>
                <p style="margin-top:var(--space-1);">Aqui está um resumo dos seus agendamentos.</p>
              </div>
              <a href="agendar.html" class="btn btn-primary">Novo agendamento</a>
            </div>
      
            <div class="grid-stats" style="margin-bottom: var(--space-7);">
              <div class="card stat-card">
                <span class="stat-card__label">Total de agendamentos</span>
                <span class="stat-card__value" id="stat-total">0</span>
              </div>
              <div class="card stat-card">
                <span class="stat-card__label">Aguardando confirmação</span>
                <span class="stat-card__value" id="stat-aguardando">0</span>
              </div>
              <div class="card stat-card">
                <span class="stat-card__label">Em andamento</span>
                <span class="stat-card__value" id="stat-andamento">0</span>
              </div>
              <div class="card stat-card">
                <span class="stat-card__label">Concluídos</span>
                <span class="stat-card__value" id="stat-concluido">0</span>
              </div>
            </div>
      
            <div class="row-between" style="margin-bottom: var(--space-4);">
              <h3>Próximos agendamentos</h3>
              <a href="agendamentos.html" style="font-size: var(--fs-caption); font-weight:600; color:var(--dg-red);">Ver todos</a>
            </div>
            <div class="stack" id="lista-proximos"></div>
            <div class="empty-state" id="vazio-proximos" hidden>
              <h3>Nenhum agendamento em aberto</h3>
              <p>Que tal agendar seu próximo serviço?</p>
              <a href="agendar.html" class="btn btn-primary" style="margin-top:var(--space-4);">Agendar serviço</a>
            </div>
          </main>
      
          <main class="app-content" id="carregando">
            <div class="stack">
              <div class="skeleton" style="height:90px;"></div>
              <div class="skeleton" style="height:90px;"></div>
            </div>
          </main>
        </div>
      </div>

</body>

</html>
