<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços — Administração | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>

        <div class="app-main">
            <header id="dg93-topbar" class="app-topbar"></header>

            <main class="app-content">
                <div class="row-between" style="margin-bottom: var(--space-5);">
                    <h2>Serviços</h2>
                    <button class="btn btn-primary" id="btn-novo-servico">Novo serviço</button>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Serviço</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-servicos"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: criar/editar serviço -->
    <div class="modal-overlay" id="modal-servico">
        <div class="modal">
            <div class="modal__head">
                <h3 id="modal-servico-titulo">Novo serviço</h3>
                <button class="modal__close" data-modal-close aria-label="Fechar">×</button>
            </div>
            <form id="form-servico">
                <input type="hidden" id="servico-id">
                <div class="field">
                    <label for="servico-nome">Nome do serviço</label>
                    <input type="text" id="servico-nome" class="input" required>
                </div>
                <div class="field">
                    <label for="servico-categoria">Categoria</label>
                    <input type="text" id="servico-categoria" class="input"
                        placeholder="Ex.: Lavagem, Estética, Higienização" required>
                </div>
                <div class="field">
                    <label for="servico-preco">Preço (R$)</label>
                    <input type="number" id="servico-preco" class="input" min="0" step="0.01" required>
                </div>
                <div class="field">
                    <label for="servico-descricao">Descrição</label>
                    <textarea id="servico-descricao" class="input" rows="3" required></textarea>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="servico-ativo">
                    <label for="servico-ativo" style="font-weight:500;">Serviço ativo (visível para clientes)</label>
                </div>
                <div class="modal__actions">
                    <button type="button" class="btn btn-ghost" data-modal-close>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar serviço</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../assets/js/data/mock-data.js"></script>
    <script src="../assets/js/data/store.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components/toast.js"></script>
    <script src="../assets/js/components/modal.js"></script>
    <script src="../assets/js/components/sidebar.js"></script>
    <script>
        const usuario = DG93Sidebar.render({ perfil: 'admin', active: 'servicos' });

        if (usuario) {
            function renderTabela() {
                const servicos = DG93Store.getServicos();
                document.getElementById('tabela-servicos').innerHTML = servicos.map(s => `
        <tr>
          <td>${s.nome_servico}</td>
          <td>${s.categoria}</td>
          <td>${DG93Utils.formatCurrency(s.preco)}</td>
          <td><span class="badge ${s.ativo ? 'badge--aprovado' : 'badge--cancelado'}">${s.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td class="col-actions">
            <button class="btn btn-outline btn-sm" data-editar="${s.id_service}">Editar</button>
            <button class="btn btn-ghost btn-sm" data-alternar="${s.id_service}">${s.ativo ? 'Desativar' : 'Ativar'}</button>
          </td>
        </tr>
      `).join('');

                document.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => abrirModal(Number(b.dataset.editar))));
                document.querySelectorAll('[data-alternar]').forEach(b => b.addEventListener('click', () => {
                    DG93Store.alternarServicoAtivo(Number(b.dataset.alternar));
                    DG93Toast.show('Status do serviço atualizado.', 'success');
                    renderTabela();
                }));
            }

            function abrirModal(id) {
                const form = document.getElementById('form-servico');
                form.reset();
                if (id) {
                    const s = DG93Store.getServico(id);
                    document.getElementById('modal-servico-titulo').textContent = 'Editar serviço';
                    document.getElementById('servico-id').value = s.id_service;
                    document.getElementById('servico-nome').value = s.nome_servico;
                    document.getElementById('servico-categoria').value = s.categoria;
                    document.getElementById('servico-preco').value = s.preco;
                    document.getElementById('servico-descricao').value = s.descricao;
                    document.getElementById('servico-ativo').checked = s.ativo;
                } else {
                    document.getElementById('modal-servico-titulo').textContent = 'Novo serviço';
                    document.getElementById('servico-id').value = '';
                    document.getElementById('servico-ativo').checked = true;
                }
                DG93Modal.open('modal-servico');
            }

            document.getElementById('btn-novo-servico').addEventListener('click', () => abrirModal(null));

            document.getElementById('form-servico').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('servico-id').value;
                DG93Store.salvarServico({
                    id_service: id ? Number(id) : undefined,
                    nome_servico: document.getElementById('servico-nome').value.trim(),
                    categoria: document.getElementById('servico-categoria').value.trim(),
                    preco: Number(document.getElementById('servico-preco').value),
                    descricao: document.getElementById('servico-descricao').value.trim(),
                    ativo: document.getElementById('servico-ativo').checked
                });
                DG93Modal.close('modal-servico');
                DG93Toast.show(id ? 'Serviço atualizado com sucesso!' : 'Serviço criado com sucesso!', 'success');
                renderTabela();
            });

            renderTabela();
        }
    </script>
</body>

</html>
