<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos — Administração | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>

        <div class="app-main">
            <header id="dg93-topbar" class="app-topbar"></header>

            <main class="app-content">
                <h2 style="margin-bottom: var(--space-5);">Agendamentos</h2>

                <div class="field" style="max-width:260px; margin-bottom: var(--space-5);">
                    <label for="filtro-status">Filtrar por status</label>
                    <select id="filtro-status" class="select">
                        <option value="">Todos os status</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Serviço</th>
                                <th>Data</th>
                                <th>Local</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-agendamentos"></tbody>
                    </table>
                </div>
                <div class="empty-state" id="vazio" hidden>
                    <h3>Nenhum agendamento encontrado</h3>
                    <p>Ajuste o filtro de status.</p>
                </div>
                <div class="pagination" id="paginacao"></div>
            </main>
        </div>
    </div>

</body>

</html>
