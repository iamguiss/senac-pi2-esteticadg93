<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Administração | DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body>

    <div class="app-shell">
        <aside id="dg93-sidebar" class="app-sidebar"></aside>

        <div class="app-main">
            <header id="dg93-topbar" class="app-topbar"></header>

            <main class="app-content">
                <h2 style="margin-bottom: var(--space-1);">Visão geral</h2>
                <p style="margin-bottom: var(--space-6);">Panorama dos atendimentos da Estética DG93.</p>

                <div class="grid-stats" style="margin-bottom: var(--space-7);">
                    <div class="card stat-card">
                        <span class="stat-card__label">Agendamentos no total</span>
                        <span class="stat-card__value" id="stat-total">0</span>
                    </div>
                    <div class="card stat-card">
                        <span class="stat-card__label">Pendentes de aprovação</span>
                        <span class="stat-card__value" id="stat-pendentes">0</span>
                    </div>
                    <div class="card stat-card">
                        <span class="stat-card__label">Em andamento</span>
                        <span class="stat-card__value" id="stat-andamento">0</span>
                    </div>
                    <div class="card stat-card">
                        <span class="stat-card__label">Clientes cadastrados</span>
                        <span class="stat-card__value" id="stat-clientes">0</span>
                    </div>
                </div>

                <div class="row-between" style="margin-bottom: var(--space-4);">
                    <h3>Agendamentos aguardando aprovação</h3>
                    <a href="agendamentos.html"
                        style="font-size: var(--fs-caption); font-weight:600; color:var(--dg-red);">Ver todos</a>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Serviço</th>
                                <th>Data</th>
                                <th>Local</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-pendentes"></tbody>
                    </table>
                </div>
                <div class="empty-state" id="vazio-pendentes" hidden>
                    <h3>Nenhum agendamento pendente</h3>
                    <p>Todos os agendamentos foram analisados.</p>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
