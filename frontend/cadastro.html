<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Estética DG93</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

    <body>

        <!-- Header -->
        <header id="dg93-navbar" class="navbar"></header>

        <main class="container" style="max-width: 460px; padding: var(--space-8) var(--space-5) var(--space-9);">
            <h1 style="font-size: var(--fs-h2);">Criar sua conta</h1>
            <p style="margin-top: var(--space-2);">Cadastre-se para agendar serviços e acompanhar seus atendimentos.</p>

            <form id="form-cadastro" class="stack" style="margin-top: var(--space-6);" novalidate>
                <div class="field" id="campo-nome">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" class="input" placeholder="Seu nome completo" required>
                    <span class="field-error">Informe seu nome completo.</span>
                </div>

                <div class="field" id="campo-email">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="input" placeholder="seuemail@exemplo.com" required>
                    <span class="field-error">Informe um e-mail válido.</span>
                </div>

                <div class="field" id="campo-cpf">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" class="input" placeholder="000.000.000-00" required>
                    <span class="field-error">Informe um CPF válido.</span>
                </div>

                <div class="field" id="campo-sexo">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" class="select" required>
                        <option value="">Selecione</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Prefiro não informar">Prefiro não informar</option>
                    </select>
                    <span class="field-error">Selecione uma opção.</span>
                </div>

                <div class="field" id="campo-senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" class="input" placeholder="Mínimo 6 caracteres" required
                        minlength="6">
                    <span class="field-error">A senha deve ter pelo menos 6 caracteres.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-cadastro">
                    <span id="btn-cadastro-label">Criar conta</span>
                </button>

                <p class="text-center" style="font-size: var(--fs-caption);">
                    Já tem uma conta? <a href="login.html" style="color: var(--dg-red); font-weight:600;">Entrar</a>
                </p>
            </form>
        </main>

        <footer id="dg93-footer" class="site-footer"></footer>

        <script src="assets/js/data/mock-data.js"></script>
        <script src="assets/js/data/store.js"></script>
        <script src="assets/js/utils.js"></script>
        <script src="assets/js/auth.js"></script>
        <script src="assets/js/components/toast.js"></script>
        <script src="assets/js/components/navbar.js"></script>
        <script src="assets/js/components/footer.js"></script>
        <script>
            DG93Navbar.render('');
            DG93Footer.render();

            const campos = {
                nome: { el: document.getElementById('campo-nome'), validar: v => v.trim().split(' ').filter(Boolean).length >= 2 },
                email: { el: document.getElementById('campo-email'), validar: v => /\S+@\S+\.\S+/.test(v) },
                cpf: { el: document.getElementById('campo-cpf'), validar: v => v.replace(/\D/g, '').length === 11 },
                sexo: { el: document.getElementById('campo-sexo'), validar: v => v !== '' },
                senha: { el: document.getElementById('campo-senha'), validar: v => v.length >= 6 }
            };

            document.getElementById('cpf').addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').slice(0, 11);
                v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = v;
            });

            const form = document.getElementById('form-cadastro');
            const btn = document.getElementById('btn-cadastro');
            const btnLabel = document.getElementById('btn-cadastro-label');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let valido = true;

                Object.entries(campos).forEach(([id, { el, validar }]) => {
                    const ok = validar(document.getElementById(id).value);
                    el.classList.toggle('has-error', !ok);
                    if (!ok) valido = false;
                });

                if (!valido) return;

                const email = document.getElementById('email').value.trim();
                if (DG93Store.getUsuarioPorEmail(email)) {
                    campos.email.el.classList.add('has-error');
                    campos.email.el.querySelector('.field-error').textContent = 'Este e-mail já está cadastrado na demonstração.';
                    return;
                }

                btn.disabled = true;
                btnLabel.innerHTML = '<span class="spinner"></span> Criando conta...';

                setTimeout(() => {
                    const novoUsuario = DG93Store.cadastrarUsuario({
                        nome: document.getElementById('nome').value.trim(),
                        email,
                        cpf: document.getElementById('cpf').value,
                        sexo: document.getElementById('sexo').value,
                        perfil: 'cliente'
                    });
                    DG93Auth.login(novoUsuario.email);
                    DG93Toast.show('Conta criada com sucesso!', 'success');
                    setTimeout(() => { window.location.href = 'cliente/dashboard.html'; }, 500);
                }, 600);
            });
        </script>
    </body>
</html>
